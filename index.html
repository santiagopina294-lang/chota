<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pregunta importante</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #faf8f5;
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 24px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #f0ece1;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #2c2c2c;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .img-main {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 10px;
    }

    button {
      flex: 1;
      padding: 14px 0;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-si {
      background-color: #e2f0d9;
      color: #385723;
    }

    .btn-no {
      background-color: #fce4d6;
      color: #c65911;
    }

    .resultado {
      display: none;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #f0ece1;
      animation: aparecer 0.3s ease-out;
    }

    .mensaje {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #2c2c2c;
      line-height: 1.3;
    }

    .img-resultado {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 12px;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>¿Daniela Cebiyano es humilde?</h1>

    <!-- Imagen del perrito -->
    <img src="perri.jpg" alt="Perrito" class="img-main">

    <div class="btn-group">
      <button class="btn-si" onclick="responder('si')">Sí</button>
      <button class="btn-no" onclick="responder('no')">No</button>
    </div>

    <div id="resultado" class="resultado">
      <p id="mensaje" class="mensaje"></p>
      <img id="imgRespuesta" class="img-resultado" src="" alt="Respuesta">
    </div>
  </div>

<script>
  // Archivos de audio locales
  const sonidoTriste = new Audio('triste.mp4');
  const sonidoBebesi = new Audio('bebesi.mp4');

  function responder(opcion) {
    const resultado = document.getElementById('resultado');
    const mensaje = document.getElementById('mensaje');
    const imgRespuesta = document.getElementById('imgRespuesta');

    // Detener audios anteriores antes de reproducir el nuevo
    sonidoTriste.pause();
    sonidoTriste.currentTime = 0;
    sonidoBebesi.pause();
    sonidoBebesi.currentTime = 0;

    if (opcion === 'no') {
      sonidoTriste.play();
      mensaje.innerText = 'Escoge bien caremoco 😡😤';
      imgRespuesta.src = 'mascara.jpg';
    } else if (opcion === 'si') {
      sonidoBebesi.play();
      mensaje.innerText = 'Todo el mundo sabe que es la peor persona del mundo 🤩🤩🤩';
      imgRespuesta.src = 'dui.jpg';
    }

    resultado.style.display = 'block';
  }
</script>

</body>
</html>
